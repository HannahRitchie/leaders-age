  if (VIEWS[viewParam]) state.group = VIEWS[viewParam];
  const rootEl = document.documentElement;
  if (params.get("highlight")) { const h = DATA.find(d => d.c.toLowerCase() === params.get("highlight").trim().toLowerCase()); if (h) state.sel = h.c; }
  if (params.get("embed") === "1") rootEl.classList.add("embed");
  if (params.get("title") === "1") rootEl.classList.add("show-title");
  if (params.get("controls") === "0") rootEl.classList.add("no-controls");
  if (["light", "dark"].includes(params.get("theme"))) rootEl.setAttribute("data-theme", params.get("theme"));

  const X_MIN = 0, X_MAX = 100, Y_MIN = 0, Y_MAX = 100;
  const NOTABLE = new Set(["Cameroon","Palestine","Malawi","Japan","Italy","Netherlands","Nepal",
    "Iceland","United States","China","India","Russia","Nigeria","Brazil","Germany","Venezuela","Mauritius"]);

  function inGroup(p) {
    return state.group === "all" || (state.group === "g20" ? p.g : p.r === state.group);
  }

  function fit(a) {
    const n = a.length;
    const mx = a.reduce((s, p) => s + p.x, 0) / n, my = a.reduce((s, p) => s + p.y, 0) / n;
    let sxy = 0, sxx = 0, syy = 0;
    for (const p of a) { sxy += (p.x - mx) * (p.y - my); sxx += (p.x - mx) ** 2; syy += (p.y - my) ** 2; }
    const slope = sxy / sxx;
    return { n, slope, int: my - slope * mx, r: sxy / Math.sqrt(sxx * syy) };
  }

  const svg = document.getElementById("svg");
  const plot = document.getElementById("plot");
  const tip = document.getElementById("tip");

  function draw() {
    const S = Math.round(Math.min(700, Math.max(300, plot.clientWidth)));
    const m = { l: 46, r: 14, t: 10, b: 46 };
    // Square plotting area, so both axes use the same scale and y = x runs corner to corner
    const W = S, H = S - m.l - m.r + m.t + m.b;
    svg.style.width = W + "px";
    const sx = v => m.l + (v - X_MIN) / (X_MAX - X_MIN) * (W - m.l - m.r);
    const sy = v => H - m.b - (v - Y_MIN) / (Y_MAX - Y_MIN) * (H - m.t - m.b);
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

    const vis = pts.filter(inGroup);
    const rad = W < 520 ? 4 : 5;
    let out = "";

    // grid + ticks
    for (let v = X_MIN; v <= X_MAX; v += 10) {
      out += `<line x1="${sx(v)}" x2="${sx(v)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--grid)"/>`;
      out += `<text x="${sx(v)}" y="${H - m.b + 18}" text-anchor="middle">${v}</text>`;
    }
    for (let v = Y_MIN; v <= Y_MAX; v += 10) {
      out += `<line x1="${m.l}" x2="${W - m.r}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--grid)"/>`;
      out += `<text x="${m.l - 8}" y="${sy(v) + 4}" text-anchor="end">${v}</text>`;
    }
    out += `<text class="axis-title" x="${(m.l + W - m.r) / 2}" y="${H - 8}" text-anchor="middle">Median age of the population (years)</text>`;
    out += `<text class="axis-title" transform="translate(13 ${(m.t + H - m.b) / 2}) rotate(-90)" text-anchor="middle">Age of the leader (years)</text>`;

    // y = x reference (clipped to the plot)
    const x0 = Math.max(X_MIN, Y_MIN), x1 = Math.min(X_MAX, Y_MAX);
    out += `<line x1="${sx(x0)}" y1="${sy(x0)}" x2="${sx(x1)}" y2="${sy(x1)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>`;

    const f = vis.length >= 8 ? fit(vis) : null;

    // points
    vis.forEach(p => {
      out += `<circle class="pt${state.sel === p.c ? " sel" : ""}" data-c="${p.c.replace(/"/g, "")}" cx="${sx(p.x)}" cy="${sy(p.y)}" r="${rad}" fill="${cssVar(p.r)}"><title>${p.c}: leader ${p.y.toFixed(1)}, population median ${p.x.toFixed(1)}</title></circle>`;
    });

    // labels: try right, left, above, below; never overlap another label or dot, and stay inside the plot
    const labelAll = vis.length <= 20 && W >= 600;   // on small screens, label only what fits
    const placed = [];
    const dots = vis.map(p => ({ x: sx(p.x), y: sy(p.y), c: p.c }));
    const hits = (a, b) => a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;
    const rank = p => (p.c === state.sel ? 2 : NOTABLE.has(p.c) ? 1 : 0);
    const order = [...vis].sort((a, b) => rank(b) - rank(a));
    order.forEach(p => {
      if (!(labelAll || NOTABLE.has(p.c) || p.c === state.sel)) return;
      const px = sx(p.x), py = sy(p.y), w = p.c.length * 6.2 + 4, hgt = 14, gap = rad + 3;
      const R = (x0, y0, anchor, tx) => ({ x0, y0, a: anchor, tx });
      const cands = [
        R(px + gap, py - hgt / 2, "start", px + gap),
        R(px - gap - w, py - hgt / 2, "end", px - gap),
        R(px - w / 2, py - rad - 3 - hgt, "middle", px),
        R(px - w / 2, py + rad + 3, "middle", px),
        R(px + gap, py - hgt - 3, "start", px + gap),
        R(px + gap, py + 3, "start", px + gap),
        R(px - gap - w, py - hgt - 3, "end", px - gap),
        R(px - gap - w, py + 3, "end", px - gap),
        R(px + gap + 8, py - hgt - 12, "start", px + gap + 8),
        R(px - gap - 8 - w, py + 12, "end", px - gap - 8),
        R(px + gap + 8, py + 12, "start", px + gap + 8),
        R(px - gap - 8 - w, py - hgt - 12, "end", px - gap - 8)
      ].map(c => ({ ...c, x1: c.x0 + w, y1: c.y0 + hgt }));
      const inside = c => c.x0 >= m.l && c.x1 <= W - 2 && c.y0 >= m.t - 2 && c.y1 <= H - m.b;
      const overlap = c => {
        let n = 0;
        placed.forEach(q => { if (hits(c, q)) n += 3; });
        dots.forEach(d => { if (d.c !== p.c && hits(c, { x0: d.x - rad, x1: d.x + rad, y0: d.y - rad, y1: d.y + rad })) n += 1; });
        return n;
      };
      let pick = cands.find(c => inside(c) && overlap(c) === 0);
      if (!pick && (labelAll || p.c === state.sel)) {
        pick = cands.filter(inside).sort((u, v) => overlap(u) - overlap(v))[0] || cands[0];
      }
      if (!pick) return;
      placed.push(pick);
      out += `<text class="lab" x="${pick.tx}" y="${pick.y0 + hgt / 2 + 4}" text-anchor="${pick.a}" style="pointer-events:none">${p.c}</text>`;
    });

    svg.innerHTML = out;
  }

  function showTip(p, ev) {
    const gap = p.y - p.x;
    tip.innerHTML = `<b>${p.c}</b>${p.n}<br>Leader: ${p.y.toFixed(1)} years<br>Population median: ${p.x.toFixed(1)} years<br>Leader is ${Math.abs(gap).toFixed(1)} years ${gap >= 0 ? "older" : "younger"}`;
    tip.style.display = "block";
    const box = plot.getBoundingClientRect();
    let left = ev.clientX - box.left + 14, top = ev.clientY - box.top + 14;
    if (left + 240 > box.width) left = ev.clientX - box.left - 250;
    if (left < 0) left = 4;
    tip.style.left = left + "px"; tip.style.top = top + "px";
  }
  const byName = c => pts.find(p => p.c === c);
  svg.addEventListener("pointermove", ev => {
    const c = ev.target.closest && ev.target.closest(".pt");
    if (c) showTip(byName(c.dataset.c), ev); else tip.style.display = "none";
  });
  svg.addEventListener("pointerleave", () => { tip.style.display = "none"; });
  svg.addEventListener("pointerdown", ev => {
    const c = ev.target.closest && ev.target.closest(".pt");
    if (c) showTip(byName(c.dataset.c), ev); else tip.style.display = "none";
  });

  // chips
  const filtersEl = document.getElementById("filters");
  const GROUPS = [["all", "All", null], ["g20", "G20", null], ...REGIONS.map(r => [r, r, r])];
  function chips() {
    filtersEl.innerHTML = GROUPS.map(([k, label, region]) =>
      `<button type="button" class="chip" data-k="${k}" aria-pressed="${state.group === k}">` +
      (region ? `<i class="dot" style="background:${cssVar(region)}"></i>` : "") + `${label}</button>`).join("");
  }
  filtersEl.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    state.group = b.dataset.k;
    if (state.sel && !pts.some(p => p.c === state.sel && inGroup(p))) state.sel = null;
    chips(); renderPick(); draw();
  });

  const pickEl = document.getElementById("pick");
  function renderPick() {
    const names = pts.filter(inGroup).map(p => p.c).sort((a, b) => a.localeCompare(b));
    pickEl.innerHTML = `<option value="">None</option>` + names.map(n => `<option value="${n.replace(/"/g, "&quot;")}"${state.sel === n ? " selected" : ""}>${n}</option>`).join("");
  }
  pickEl.addEventListener("change", () => { state.sel = pickEl.value || null; draw(); });

  chips(); renderPick(); draw();
  new ResizeObserver(draw).observe(plot);

  document.getElementById("foot").textContent =
    "Data sources: Wikipedia and Wikidata (leader birth dates); UN World Population Prospects via Our World in Data (median age). Leader ages as of " +
    today.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }) + ".";
</script>
</body>
</html>
