:"1969-05-18","r":"South America","v":1,"t":[["2026-01-05"]]},{"c":"Fiji","n":"Sitiveni Rabuka","b":"1948-09-13","r":"Oceania","v":2,"t":[["1992-06-02","1999-05-19"],["2022-12-24"]]},{"c":"New Zealand","n":"Christopher Luxon","b":"1970-07-19","r":"Oceania","v":3,"t":[["2023-11-27"]]},{"c":"Papua New Guinea","n":"James Marape","b":"1971-04-24","r":"Oceania","v":1,"t":[["2019-05-30"]]}];

  const MS_YEAR = 365.2425 * 24 * 3600 * 1000;
  const today = new Date();
  const REGIME = { 3: "Liberal democracy", 2: "Electoral democracy", 1: "Electoral autocracy", 0: "Closed autocracy" };
  const people = DATA.map(p => {
    const age = (today - new Date(p.b + "T00:00:00Z")) / MS_YEAR;
    const ten = p.t.reduce((sum, [s, e]) => sum + ((e ? new Date(e + "T00:00:00Z") : today) - new Date(s + "T00:00:00Z")) / MS_YEAR, 0);
    return { ...p, age, ten };
  });
  const byCountry = new Map(people.map(p => [p.c.toLowerCase(), p]));

  const REGIONS = ["Africa", "Asia", "Europe", "North America", "South America", "Oceania"];
  const state = { highlight: [] };

  // ---- URL options, for embedding ----
  //   ?highlight=Brazil,China (comma separated country names)
  //   &embed=1 (hide subtitle and notes)  &title=1 (keep the title in embed mode)
  //   &controls=0 (hide the menu)  &theme=light|dark
  const params = new URLSearchParams(location.search);
  const rootEl = document.documentElement;
  if (params.get("highlight")) {
    state.highlight = params.get("highlight").split(",").map(s => byCountry.get(s.trim().toLowerCase())).filter(Boolean).map(p => p.c);
  }
  if (params.get("embed") === "1") rootEl.classList.add("embed");
  if (params.get("title") === "1") rootEl.classList.add("show-title");
  if (params.get("controls") === "0") rootEl.classList.add("no-controls");
  if (["light", "dark"].includes(params.get("theme"))) rootEl.setAttribute("data-theme", params.get("theme"));

  const AXIS_MIN = 0, AXIS_MAX = 55;
  const fmt = n => n.toFixed(1);
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  const median = a => { const s = [...a].sort((x, y) => x - y), n = s.length; return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; };

  function makeGroups() {
    return [3, 2, 1, 0].map(v => ({ label: REGIME[v], items: people.filter(p => p.v === v) }));
  }

  // text width, measured with the page font
  const ctx = document.createElement("canvas").getContext("2d");
  const textW = (t, font) => { ctx.font = font; return ctx.measureText(t).width; };

  const svg = document.getElementById("svg");
  const plot = document.getElementById("plot");
  const tip = document.getElementById("tip");

  function draw() {
    const W = Math.max(300, plot.clientWidth);
    const padL = 16, padR = 16;
    const r = W < 560 ? 4.4 : 5.4, d = 2 * r + 1.4;
    const sx = a => padL + (a - AXIS_MIN) / (AXIS_MAX - AXIS_MIN) * (W - padL - padR);
    const groups = makeGroups();
    const labelFont1 = "600 12.5px Inter, system-ui, sans-serif", labelFont2 = "400 12px Inter, system-ui, sans-serif";
    const hl = new Set(state.highlight);

    // 1. beeswarm positions within each group
    groups.forEach(g => {
      const pts = [...g.items].sort((a, b) => a.ten - b.ten || a.c.localeCompare(b.c)).map(p => ({ p, x: sx(p.ten), y: 0 }));
      g.med = median(g.items.map(p => p.ten));
      const placed = [];
      pts.forEach(pt => {
        const near = placed.filter(q => Math.abs(q.x - pt.x) < d);
        const cands = [0];
        near.forEach(q => { const h = Math.sqrt(Math.max(0, d * d - (pt.x - q.x) ** 2)); cands.push(q.y + h, q.y - h); });
        cands.sort((a, b) => Math.abs(a) - Math.abs(b) || a - b);
        pt.y = cands.find(y => near.every(q => (q.x - pt.x) ** 2 + (q.y - y) ** 2 >= d * d - 0.01));
        placed.push(pt);
      });
      g.pts = pts;
      g.maxAbs = Math.max(0, ...pts.map(q => Math.abs(q.y)));
      // 2. which dots get a label: youngest, oldest and any highlighted
      const longest = pts[pts.length - 1];
      g.labels = pts.filter(q => q === longest || hl.has(q.p.c)).map(q => {
        const l1 = `${q.p.n.replace(/ \(acting\)$/, "")}, ${fmt(q.p.ten)}`, l2 = q.p.c;
        const w = Math.max(textW(l1, labelFont1), textW(l2, labelFont2));
        let x0 = q.x - w / 2, anchorX = q.x, anchor = "middle";
        if (x0 < padL) { x0 = padL; anchor = "start"; anchorX = padL; }
        else if (x0 + w > W - padR) { x0 = W - padR - w; anchor = "end"; anchorX = W - padR; }
        return { q, l1, l2, w, x0, x1: x0 + w, anchor, anchorX, level: 0 };
      }).sort((a, b) => a.x0 - b.x0);
      const lastEnd = [];
      g.labels.forEach(L => {
        let lv = 0;
        while (lastEnd[lv] !== undefined && lastEnd[lv] + 10 > L.x0) lv++;
        L.level = lv; lastEnd[lv] = L.x1;
      });
      g.levels = g.labels.length ? Math.max(...g.labels.map(L => L.level)) + 1 : 0;
    });

    // 3. vertical layout
    const LEVEL_H = 40;
    let cur = 6; const top = cur;
    groups.forEach(g => {
      g.titleY = cur + 15; cur += 26;
      cur += g.levels ? g.levels * LEVEL_H + 8 : 4;
      const half = Math.max(g.maxAbs + r, 14);
      g.swarmTop = cur; g.baseY = cur + half; cur += 2 * half + 20;
    });
    const plotBottom = cur - 8;
    const H = plotBottom + 28;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.style.height = H + "px";

    let out = "";
    // label blocks and their positions (needed before the gridlines are drawn)
    groups.forEach(g => g.labels.forEach(L => { L.blockBottom = g.swarmTop - 8 - L.level * LEVEL_H; }));
    // areas the gridlines must not cross: group titles and point labels
    const avoid = [];
    groups.forEach(g => {
      g.titleW = textW(g.label, "700 15px Inter, system-ui, sans-serif");
      g.medText = "median " + fmt(g.med) + " years";
      g.medW = textW(g.medText, "400 12.5px Inter, system-ui, sans-serif");
      avoid.push({ x0: padL - 3, x1: padL + g.titleW + 12 + g.medW + 8, y0: g.titleY - 18, y1: g.titleY + 7 });
      g.labels.forEach(L => avoid.push({ x0: L.x0 - 5, x1: L.x1 + 5, y0: L.blockBottom - 36, y1: L.blockBottom + 5 }));
    });
    // gridlines (drawn in pieces, skipping the areas above) + tick labels
    for (let a = 0; a <= 50; a += 10) {
      const x = sx(a);
      const stop = avoid.filter(r => x >= r.x0 && x <= r.x1).sort((u, v) => u.y0 - v.y0);
      let y = top;
      const stroke = "var(--grid)", sw = 1;
      const piece = (y0, y1) => { if (y1 - y0 > 1) out += `<line class="gl" x1="${x}" x2="${x}" y1="${y0}" y2="${y1}" stroke="${stroke}" stroke-width="${sw}"/>`; };
      stop.forEach(r => { piece(y, r.y0); y = Math.max(y, r.y1); });
      piece(y, plotBottom);
      out += `<text x="${x}" y="${plotBottom + 18}" text-anchor="middle">${a}</text>`;
    }
    groups.forEach(g => {
      out += `<text class="gtitle" x="${padL}" y="${g.titleY}">${esc(g.label)}</text>`;
      out += `<text class="gmed" x="${padL + g.titleW + 12}" y="${g.titleY}">${g.medText}</text>`;
      // leader lines for labelled dots (drawn under the dots)
      g.labels.forEach(L => {
        const blockBottom = L.blockBottom;
        out += `<line x1="${L.q.x}" x2="${L.q.x}" y1="${blockBottom + 2}" y2="${g.baseY + L.q.y - r}" stroke="var(--muted)" stroke-width="1"/>`;
      });
      g.pts.filter(q => !hl.has(q.p.c)).concat(g.pts.filter(q => hl.has(q.p.c))).forEach(q => {
        out += `<circle class="pt${hl.has(q.p.c) ? " hl" : ""}" data-c="${esc(q.p.c)}" cx="${q.x.toFixed(1)}" cy="${(g.baseY + q.y).toFixed(1)}" r="${r}"><title>${esc(q.p.c)}: ${fmt(q.p.ten)} years</title></circle>`;
      });
      g.labels.forEach(L => {
        out += `<text class="lab1" x="${L.anchorX}" y="${L.blockBottom - 19}" text-anchor="${L.anchor}">${esc(L.l1)}</text>`;
        out += `<text class="lab2" x="${L.anchorX}" y="${L.blockBottom - 3}" text-anchor="${L.anchor}">${esc(L.l2)}</text>`;
      });
    });
    svg.innerHTML = out;
  }

  // ---- text that depends on the grouping ----
  const asofText = today.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
  function renderText() {
    document.getElementById("lede").textContent =
      "Each dot is a country. Shown is how long its leader (the person who holds main executive power: the prime minister, president, or monarch) has been in office, adding up all their terms. Regimes follow V-Dem's Regimes of the World classification for 2025.";
    document.getElementById("foot").textContent =
    "Data sources: Wikipedia and Wikidata (leader terms of office); V-Dem, Democracy Report v16 (2026), Regimes of the World, 2025, via Our World in Data. Years in office as of " + asofText + ".";
  }

  // ---- controls ----
  const pickEl = document.getElementById("pick");
  function renderPick() {
    const names = people.map(p => p.c).sort((a, b) => a.localeCompare(b));
    pickEl.innerHTML = `<option value="">None</option>` + names.map(n => `<option value="${esc(n)}"${state.highlight[0] === n ? " selected" : ""}>${esc(n)}</option>`).join("");
  }
  pickEl.addEventListener("change", () => { state.highlight = pickEl.value ? [pickEl.value] : []; draw(); });

  // ---- tooltip ----
  const byName = new Map(people.map(p => [p.c, p]));
  function showTip(c, ev) {
    const p = byName.get(c); if (!p) return;
    tip.innerHTML = `<b>${esc(p.c)}</b>${esc(p.n)}<br>In office: <b style="display:inline">${fmt(p.ten)} years</b>${p.t.filter(x => x[2] !== "i").length > 1 ? ` (${p.t.filter(x => x[2] !== "i").length} terms)` : ""}<br>Leader's age: ${fmt(p.age)} years<br>${REGIME[p.v]}`;
    tip.style.display = "block";
    let left = ev.clientX + 14, top = ev.clientY + 14;
    if (left + 260 > innerWidth) left = ev.clientX - 264;
    if (top + 110 > innerHeight) top = ev.clientY - 110;
    tip.style.left = Math.max(4, left) + "px"; tip.style.top = Math.max(4, top) + "px";
  }
  const hit = ev => ev.target.closest && ev.target.closest(".pt");
  svg.addEventListener("pointermove", ev => { const t = hit(ev); if (t) showTip(t.dataset.c, ev); else tip.style.display = "none"; });
  svg.addEventListener("pointerdown", ev => { const t = hit(ev); if (t) showTip(t.dataset.c, ev); else tip.style.display = "none"; });
  svg.addEventListener("pointerleave", () => { tip.style.display = "none"; });

  renderText(); renderPick(); draw();
  new ResizeObserver(draw).observe(plot);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
</script>
